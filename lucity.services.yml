# Lucity service configuration for the Lunel monorepo.
#
# DEFAULT (zero-config): deploy the repository ROOT as ONE service.
#   railpack detects Python from ./requirements.txt and runs `python main.py`
#   (console + embedded worker + Core launcher in one process tree).
#   Attach a domain, provision one-click PostgreSQL, set LUNEL_GITHUB_* — done.
#
# ADVANCED (split nodes): two services from the same repo —
#   console: root_directory console/api, public domain attached
#   worker:  root_directory worker, NO domain (internal-only),
#            reachable as http://worker:9100 via Kubernetes DNS.
#   See docs/DEPLOYMENT.md section 2.

services:
  unified:
    root_directory: .
    port: 8080
    start_command: "python main.py"
    healthcheck_path: /health
    # public domain: attach in the Lucity dashboard (Generate Domain)

  console:
    root_directory: console/api
    port: 8080
    start_command: "python -m lunel_console"
    healthcheck_path: /health

  worker:
    root_directory: worker
    port: 9100
    start_command: "python -m lunel_worker"
    healthcheck_path: /health
    # no domains → internal-only
